services:
  openbao:
    image: quay.io/openbao/openbao:2.1.1
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  secrets-vault:
    build:
      context: ../..
      dockerfile: secrets-vault/Dockerfile
    ports:
      - "9551:9551"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: secrets-vault
      SECRETS_BACKEND: vault
      SECRETS_GRPC_ADDR: 127.0.0.1:9551
      VAULT_ADDR: http://openbao:8200
      VAULT_TOKEN: root
    depends_on:
      core:
        condition: service_healthy
      openbao:
        condition: service_healthy
