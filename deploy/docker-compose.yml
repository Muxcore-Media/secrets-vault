services:
  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  secrets-vault:
    build:
      context: ../..
      dockerfile: secrets-vault/Dockerfile
    ports:
      - "9551:9551"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: secrets-vault
      SECRETS_BACKEND: vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      SECRETS_GRPC_ADDR: ":9551"
    depends_on:
      core:
        condition: service_healthy
