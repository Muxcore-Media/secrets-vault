name: Release
on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false
      - name: Point core module at sibling checkout
        run: |
          go mod edit -replace=github.com/Muxcore-Media/core=./core
          go mod edit -replace=github.com/Muxcore-Media/core/pkg/contracts=./core/pkg/contracts
          go mod edit -replace=github.com/Muxcore-Media/core/sdk/go/module=./core/sdk/go/module
      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/secrets-vault-linux-amd64 ./cmd/module
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/secrets-vault-linux-arm64 ./cmd/module
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/secrets-vault:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/secrets-vault:latest
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
